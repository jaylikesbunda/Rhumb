name: security

# Runs on changes to the dependency graph and once a week, so a new advisory
# against an already-pinned crate is caught even when nothing is committed.

on:
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  advisories:
    runs-on: ubuntu-latest
    # audit-check publishes its findings as a check run, and files an issue for
    # each new advisory on the weekly schedule. Both need scoped permissions:
    # the default token is read-only.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The advisories deny.toml already accepts, so the two security jobs
          # agree and the weekly run does not re-file them as issues.
          ignore: |
            RUSTSEC-2026-0192
            RUSTSEC-2026-0194
            RUSTSEC-2026-0195
            RUSTSEC-2026-0245
            RUSTSEC-2026-0246
            RUSTSEC-2026-0370
            RUSTSEC-2026-0371
            RUSTSEC-2026-0372

  licenses-and-bans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate the SBOM
        run: cargo cyclonedx --format json
      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
