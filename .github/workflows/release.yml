name: release

# Run by hand from the Actions tab: enter the version and it builds, tags and publishes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (digits and dots only)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 1.2.3" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Refuse to overwrite an existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Make the build reproducible
        run: |
          # A commit timestamp instead of "now", and no incremental artifacts,
          # so the same source builds the same bytes far more often than not.
          # The installers (WiX, NSIS) are not bit-for-bit reproducible; the
          # checksums still let any download be verified against the release.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Fetch the WiX toolset
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix.zip"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wix" -Force
          "$env:RUNNER_TEMP\wix" >> $env:GITHUB_PATH

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build the NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 "/DVERSION=$env:VERSION" installer\rhumb.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tools/build_msi.sh
          mkdir -p stage
          cp target/release/rhumb.exe stage/
          cp LICENSE README.md stage/
          7z a "dist/rhumb-${VERSION}-windows-portable.zip" ./stage/*
          ls -l dist

      - name: Write the checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd dist
          sha256sum ./*.exe ./*.msi ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Rhumb ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.msi
            dist/*setup.exe
            dist/*.zip
            dist/SHA256SUMS
