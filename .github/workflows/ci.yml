name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lint is its own job, so a formatting slip does not sit behind the tests.
  lint:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # The suite is split so the parts run on several runners at once instead of
  # end to end. `--skip` may be repeated; the four `--skip`s below leave only
  # the small, fast tests here.
  test-core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test --
          --skip codeedit::sweep
          --skip codeedit::behaviour
          --skip codeedit::multi_tests
          --skip app::full_app

  # The editor's own spec: real input events, drawn geometry, timing. Split over
  # two runners with nextest, since it is the second-longest part.
  test-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run codeedit::behaviour -E 'not test(/(instant|quick)/)' --partition count:${{ matrix.shard }}/2
      - run: cargo nextest run codeedit::multi_tests -E 'not test(/(instant|quick)/)' --partition count:${{ matrix.shard }}/2

  # The whole-window tests: they build real folders and run real frames, and 140
  # of them on one runner overran the timeout. Shard them across four runners
  # with nextest's deterministic partitioning.
  test-app:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run app::full_app -E 'not test(/(fits_in_a_frame|stays_cheap|instant|quick)/)' --partition count:${{ matrix.shard }}/4

  sweep:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test codeedit::sweep

  # Linux is a portability check, not a second full run: everything must
  # compile with the test targets (which catches a missing `cfg`), and the code
  # that actually differs on Linux - the clipboard and single-instance paths,
  # plus the cross-platform filesystem model - gets a run.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install winit/egui system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --all-targets
      - run: "cargo test clip::"
      - run: "cargo test instance::"
      - run: "cargo test fs_model::"

  # The frame-cost budgets only mean something on a quiet machine with nothing
  # else running, so they are not in the correctness jobs: they run here, in
  # release, one at a time. The nextest override in .config/nextest.toml asks
  # for every thread, which enforces that.
  bench:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --release -E 'test(/(fits_in_a_frame|stays_cheap|instant|quick)/)'
