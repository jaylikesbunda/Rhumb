name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything except the exhaustive editor sweeps, which are the long pole. They
  # run in their own job so the two halves run side by side instead of end to end.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -- --skip codeedit::sweep

  sweep:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test codeedit::sweep

  # The app builds and runs on Linux too, through the portable code paths in
  # `clip` and `instance`. winit/egui need system libraries the runner does not
  # ship; the tests themselves run without a display.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install winit/egui system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo check --all-targets
      - run: cargo test -- --skip codeedit::sweep

  # The frame-cost gate. The budgets live in the tests themselves; this job
  # fails when a change makes a frame cross one. It runs in release, where the
  # numbers the README quotes are measured.
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Whole-app frame budget
        run: cargo test --release fits_in_a_frame -- --nocapture --test-threads=1
      - name: Instant-operation budget
        run: cargo test --release instant -- --nocapture --test-threads=1
