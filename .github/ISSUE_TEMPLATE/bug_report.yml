name: Bug report
description: Something is wrong, or Rhumb crashed.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A crash or a wrong result with clear steps is
        the most useful thing you can send.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact clicks or keys, starting from a fresh window.
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From Settings → About, or the release tag.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: |
        After a crash, please attach `%LOCALAPPDATA%\rhumb\rhumb.log` (Windows)
        or `~/.local/share/rhumb/rhumb.log` (Linux).
    validations:
      required: false
