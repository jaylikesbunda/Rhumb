[package]
name = "rhumb"
version = "0.2.0"
edition = "2024"
# The floor is set by let-chains, not by the edition.
rust-version = "1.88"
description = "A minimal, fast, dark file explorer with a built-in text and Markdown editor"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jaylikesbunda/Rhumb"
categories = ["gui", "filesystem"]
keywords = ["file-explorer", "markdown", "editor", "gui", "dark"]

[[bin]]
name = "rhumb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
dirs = "7.0.0"
eframe = "0.36.2"
egui = { version = "0.36.2", features = ["serde"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }
env_logger = "0.11.11"
image = { version = "0.25.9", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }
jiff = "0.2.37"
log = "0.4.34"
notify = "8.2.0"
open = "5.4.4"
pulldown-cmark = "0.13.4"
resvg = { version = "0.48", default-features = false, features = ["text"] }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
sysinfo = "0.39.6"
trash = "5.2.9"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
walkdir = "2.5.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Reading 7z only: the compressor is not part of the program.
sevenz-rust = { version = "0.6.1", default-features = false }
# Reading RAR only: the writer is not part of the program.
rars = { version = "0.10.0", default-features = false }

[dev-dependencies]
# The tests build a small 7z to read back, which needs the encoder. Kept out of
# the normal dependencies so the shipped binary does not carry it.
sevenz-rust = { version = "0.6.1", default-features = false, features = ["compress"] }
# The tests build a small RAR to read back the same way; its writer is likewise
# kept out of the normal dependencies.
rars = { version = "0.10.0", default-features = false, features = ["write"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
